# Python packaging for agri-svm-classification.
#
#   pip install "git+https://github.com/lunganlungpg/agri-svm-classification.git"
#   import agrisvm            # or run `agri-svm --help`
#
# The source lives in ./python and is installed under the import name `agrisvm`
# (see [tool.setuptools.package-dir] below), so the existing scripts keep working.

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-svm-classification"
version = "1.0.0"
description = "Support Vector Machine classification of crop health and stress from phenomic data"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Lunganlung P. G." }]
keywords = ["agriculture", "svm", "classification", "crop-disease", "phenomics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime dependencies (requirements.txt also lists notebook extras).
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "plotly>=5.15",
]

[project.scripts]
agri-svm = "agrisvm.cli:main"

[project.urls]
Homepage = "https://github.com/lunganlungpg/agri-svm-classification"
Source = "https://github.com/lunganlungpg/agri-svm-classification"

[tool.setuptools]
packages = ["agrisvm"]

[tool.setuptools.package-dir]
agrisvm = "python"
